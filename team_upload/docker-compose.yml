# 一鍵起「MySQL + phpMyAdmin + 抓價入庫程式」（對應課程 12/22）
# 用法：
#   docker compose up --build          # 建 image、起 MySQL+phpMyAdmin、跑抓價入庫
#   docker compose down                # 關閉（加 -v 連資料一起刪）
#
# 看資料：瀏覽器開 http://localhost:8080（帳號 root / 密碼 rootpass）
# MySQL 會自動載入 schema.sql 建表；crawler 會等 MySQL 健康後才開始寫入。

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: etf
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro   # 第一次啟動自動建表
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 網頁版 MySQL 管理介面（course 22）：開 http://localhost:8080，帳號 root / 密碼 rootpass
  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    ports:
      - "8080:80"
    depends_on:
      - mysql

  crawler:
    build: .
    # 若要改用 Docker Hub 上已 push 的 image，改成下面這行（並註解掉 build）：
    # image: your-dockerhub-account/etf-crawler:0.0.1   # ⚠ your-dockerhub-account 請改成你自己的 Docker Hub 帳號
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpass
      MYSQL_DB: etf
      # ETF_LIMIT: "15"              # 想先小量測試就把這行打開

volumes:
  mysql_data:
